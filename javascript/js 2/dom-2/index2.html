<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive design -->
    <title>Document</title>
</head>

<!-- Background and text color styling -->
<body style="background-color:black;color: bisque;">
    
</body>

<script>

    // Create a new div element dynamically
    const div = document.createElement('div');

    // Print created div in console
    console.log(div);

    // Add class name to div
    div.className = "main";

    // Add random id between 1 to 11
    div.id = Math.round(Math.random() * 10 + 1);

    // Set attribute (title)
    div.setAttribute("title", "generated title");

    // Add background color
    div.style.backgroundColor = "green";

    // Add padding
    // Remove ; inside value
    div.style.padding = "12px";

    // Add text inside div
    div.innerText = "Aditya";

    // Append div to body
    // So it becomes visible on webpage
    document.body.appendChild(div);

</script>
</html>
